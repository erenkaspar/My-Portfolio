<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Eren Kaspar</title>
    <meta
      name="description"
      content="Eren Kaspar's personal site. Currently under maintenance, back soon."
    />
    <meta name="author" content="Eren Kaspar" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://erenkaspar.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://erenkaspar.com/" />
    <meta property="og:title" content="Eren Kaspar" />
    <meta property="og:description" content="Personal site. Under maintenance, back soon." />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400&display=swap"
    />

    <style>
      @layer tokens, base, components;
    </style>
    <link rel="stylesheet" href="assets/styles/tokens.css" />
    <link rel="stylesheet" href="assets/styles/base.css" />
    <link rel="stylesheet" href="assets/styles/components.css" />

    <script defer src="assets/scripts/main.js"></script>
  </head>

  <body>
    <svg style="display: none" aria-hidden="true">
      <symbol id="icon-arrow" viewBox="0 0 24 24">
        <path d="M7 17 17 7M7 7h10v10" />
      </symbol>
    </svg>

    <canvas class="snow" data-snow aria-hidden="true"></canvas>

    <main class="page">
      <div class="card">
        <header class="profile">
          <div class="avatar" aria-hidden="true">EK</div>
          <div>
            <p class="profile__name">Eren Kaspar</p>
            <p class="profile__role">Making mods, bots &amp; side projects</p>
          </div>
        </header>

        <p class="badge">
          <span class="badge__dot" aria-hidden="true"></span>
          Under maintenance
        </p>

        <section class="content">
          <h1 class="content__title">The site is being rebuilt.</h1>
          <p class="content__text">
            I'm working on a new version of this site. It will be back soon. Until then, you can
            find me here.
          </p>
        </section>

        <ul class="links">
          <li>
            <a class="link" href="mailto:erenkaspar@gmail.com">
              <span class="link__label">Email</span>
              <span class="link__meta">
                erenkaspar@gmail.com
                <svg class="link__arrow" aria-hidden="true"><use href="#icon-arrow" /></svg>
              </span>
            </a>
          </li>
          <li>
            <a
              class="link"
              href="https://github.com/erenkaspar"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span class="link__label">GitHub</span>
              <span class="link__meta">
                @erenkaspar
                <svg class="link__arrow" aria-hidden="true"><use href="#icon-arrow" /></svg>
              </span>
            </a>
          </li>
          <li>
            <a
              class="link"
              href="https://www.linkedin.com/in/erenkaspar/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span class="link__label">LinkedIn</span>
              <span class="link__meta">
                in/erenkaspar
                <svg class="link__arrow" aria-hidden="true"><use href="#icon-arrow" /></svg>
              </span>
            </a>
          </li>
        </ul>

        <footer class="footer">
          <p>&copy; <span data-current-year>2026</span> Eren Kaspar</p>
        </footer>
      </div>
    </main>
  </body>
</html>
